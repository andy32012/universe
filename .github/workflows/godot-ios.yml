# Builds the Godot port (godot/) as an iPad app on a GitHub-hosted Mac, unsigned, for installing with
# Sideloadly from Windows like the web-view app (see ios/README.md). A separate app (its own bundle id), so
# the web-view app stays installed beside it.
name: iPad App (Godot)

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - .github/workflows/godot-ios.yml

concurrency:
  group: godot-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-macos

      - name: Download Godot and its export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          mkdir -p ~/godot
          curl -fsSL -o ~/godot/editor.zip "$base/Godot_v${GODOT_RELEASE}_macos.universal.zip"
          (cd ~/godot && unzip -q editor.zip && rm editor.zip)
          curl -fsSL -o ~/godot/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          (cd ~/godot && unzip -q templates.tpz && mv templates/* "$dest/" && rm -rf templates templates.tpz)
          ls "$dest" | head

      - name: Number this build
        run: |
          # the log and the settings panel show it; the app's build number too
          python3 - "${{ github.run_number }}" <<'EOF'
          import re, sys
          n = sys.argv[1]
          p = 'godot/export_presets.cfg'
          s = open(p, encoding='utf-8').read()
          open(p, 'w', encoding='utf-8').write(re.sub(r'(?m)^application/version=.*$', 'application/version="%s"' % n, s))
          p = 'godot/project.godot'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'(?m)^(config/description=.*)$', r'\1\nconfig/version="godot-%s"' % n, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          grep -n 'version' godot/project.godot godot/export_presets.cfg

      - name: Build the share-sheet plugin
        run: |
          # ios/plugins/sharelog: the 分享記錄檔 button's share sheet; Godot's export links sharelog.a in
          cd godot/ios/plugins/sharelog
          xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -O2 -c sharelog.mm -o sharelog.o
          libtool -static -o sharelog.a sharelog.o
          ls -la

      - name: Export the Xcode project (shader baker on)
        run: |
          GODOT=~/godot/Godot.app/Contents/MacOS/Godot
          $GODOT --version
          ls "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable" | head -20
          mkdir -p build/ios
          $GODOT --headless --path godot --import > build/import.log 2>&1 || true
          # a log file as one annotation (colours stripped, newlines encoded as %0A)
          clean() { sed -e $'s/\x1b\\[[0-9;]*m//g' "$1" | grep -v -e 'HDR output' -e 'display_server.cpp' -e '^\[ *[0-9]*% \]' | tail -60 | awk '{printf "%s%%0A", $0}'; }
          # The shader baker compiles the Metal shaders at export, which needs a graphics device: run the editor
          # with the Mac's GPU rather than headless.
          # (perl's alarm: give up after 15 minutes rather than hang if no window session is available)
          perl -e 'alarm 900; exec @ARGV' $GODOT --path godot --export-release "iOS" ../build/ios/Universe.ipa > build/export.log 2>&1 || true
          cat build/export.log
          if ls -d build/ios/*.xcodeproj >/dev/null 2>&1; then
            echo "::notice::Exported with the shader baker."
            exit 0
          fi
          echo "::warning::Export with the shader baker failed:%0A$(clean build/export.log)"
          # still make an installable app: the same export without the baker (shaders compile on first use instead)
          sed -i '' 's/^shader_baker\/enabled=true/shader_baker\/enabled=false/' godot/export_presets.cfg
          $GODOT --headless --path godot --export-release "iOS" ../build/ios/Universe.ipa > build/export-nobake.log 2>&1 || true
          cat build/export-nobake.log
          if ls -d build/ios/*.xcodeproj >/dev/null 2>&1; then
            echo "::warning::Exported WITHOUT the shader baker."
            exit 0
          fi
          echo "::error::No Xcode project was exported, even without the shader baker:%0A$(clean build/export-nobake.log)"
          echo "::error::import log:%0A$(clean build/import.log)"
          exit 1
      - name: Build without signing
        run: |
          cd build/ios
          proj=$(ls -d *.xcodeproj | head -1)
          scheme=$(basename "$proj" .xcodeproj)
          echo "::notice::Xcode project: $proj"
          if grep -rq sharelog_init . ; then echo "::notice::Share-sheet plugin linked."; else echo "::warning::Share-sheet plugin NOT in the project: the 分享記錄檔 button will fall back to copying."; fi
          xcodebuild -list -project "$proj" || true
          if ! xcodebuild build -project "$proj" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            tail -80 "$RUNNER_TEMP/xcodebuild.log"
            grep -E 'error:|\*\* BUILD FAILED|xcodebuild: error' "$RUNNER_TEMP/xcodebuild.log" | head -30 | sed 's/^/::error::xcode: /'
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/xcodebuild.log"
          app=$(ls -d "$RUNNER_TEMP"/derived/Build/Products/Release-iphoneos/*.app | head -1)
          # drop the symbol table the app does not need (about 24 MB): smaller to install, and Sideloadly 0.70.1
          # crashes while preparing the full-size binary
          exe="$app/$(plutil -extract CFBundleExecutable raw "$app/Info.plist")"
          before=$(stat -f %z "$exe")
          xcrun strip -S -x "$exe"
          echo "::notice::Executable $before -> $(stat -f %z "$exe") bytes after strip"
          plutil -p "$app/Info.plist"
          echo "::notice::App size $(du -sh "$app" | cut -f1)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry Universe-Godot-unsigned.ipa Payload)
      - name: Keep the unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Godot-unsigned-ipa
          path: ${{ runner.temp }}/ipa/Universe-Godot-unsigned.ipa
          compression-level: 0

      - name: Keep the export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-log
          path: build/*.log
          if-no-files-found: ignore
